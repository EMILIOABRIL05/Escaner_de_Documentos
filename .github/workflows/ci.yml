name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      grabar-capturas:
        description: "Grabar de nuevo las capturas de referencia en Linux"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Puerta de calidad
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Formato, análisis estático, lint, pruebas y cobertura
        run: ./gradlew ktlintCheck detekt lint testDebugUnitTest koverVerify --continue

      - name: Verificar capturas de pantalla
        run: ./gradlew verifyRoborazziDebug

      - name: Compilar release con R8
        run: ./gradlew assembleRelease

      - name: Subir reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/roborazzi/**
          retention-days: 14

  record-screenshots:
    name: Grabar capturas en Linux
    if: github.event_name == 'workflow_dispatch' && inputs.grabar-capturas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grabar capturas
        run: ./gradlew recordRoborazziDebug

      - name: Subir capturas para reemplazar las de referencia
        uses: actions/upload-artifact@v7
        with:
          name: capturas-linux
          path: "**/src/test/screenshots/*.png"
          retention-days: 14
