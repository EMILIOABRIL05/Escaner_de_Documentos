name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Puerta de calidad
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Formato, análisis estático, lint, pruebas y cobertura
        run: ./gradlew ktlintCheck detekt lint testDebugUnitTest koverVerify --continue

      - name: Compilar release con R8
        run: ./gradlew assembleRelease

      - name: Subir reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 14
